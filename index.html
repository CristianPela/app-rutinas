<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitPulse - Elite Workout Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8' },
            dark: { 900: '#0F172A', 800: '#1E293B', 700: '#334155' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen pb-20 font-sans antialiased">

  <!-- AUTH SCREEN -->
  <div id="auth-view" class="flex flex-col justify-center items-center min-h-screen p-6">
    <div class="w-full max-w-md bg-dark-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-600/20 text-brand-500 mb-4">
          <i class="fa-solid fa-dumbbell text-3xl"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight">FIT<span class="text-brand-500">PULSE</span></h1>
        <p class="text-slate-400 text-sm mt-1">Plataforma Profesional de Entrenamiento</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-user"></i></span>
            <input type="text" id="login-user" required class="w-full pl-10 pr-4 py-3 bg-dark-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-white text-sm" placeholder="Tu usuario">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="login-pass" required class="w-full pl-10 pr-4 py-3 bg-dark-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none text-white text-sm" placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl shadow-lg transition duration-200">
          Iniciar Sesión
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP VIEW -->
  <div id="app-view" class="hidden">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-dark-800/80 backdrop-blur-md border-b border-slate-700/50 px-4 py-4">
      <div class="max-w-xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-brand-600/30 flex items-center justify-center text-brand-500 font-bold">
            <i class="fa-solid fa-user text-lg"></i>
          </div>
          <div>
            <h2 id="user-display" class="font-bold text-sm leading-tight">Cristian</h2>
            <span class="text-xs text-brand-500 font-medium">Objetivo: Hipertrofia</span>
          </div>
        </div>
        <button onclick="handleLogout()" class="text-slate-400 hover:text-red-400 text-sm">
          <i class="fa-solid fa-right-from-bracket text-lg"></i>
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="max-w-xl mx-auto p-4 space-y-6">
      <!-- Summary Dashboard -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-dark-800 p-4 rounded-xl border border-slate-700/50 text-center">
          <span class="block text-xs text-slate-400">Ejercicios</span>
          <span id="stat-exercises" class="text-xl font-bold text-white mt-1">0</span>
        </div>
        <div class="bg-dark-800 p-4 rounded-xl border border-slate-700/50 text-center">
          <span class="block text-xs text-slate-400">Volumen</span>
          <span id="stat-volume" class="text-xl font-bold text-brand-500 mt-1">0 kg</span>
        </div>
        <div class="bg-dark-800 p-4 rounded-xl border border-slate-700/50 text-center">
          <span class="block text-xs text-slate-400">Completado</span>
          <span id="stat-progress" class="text-xl font-bold text-emerald-400 mt-1">0%</span>
        </div>
      </div>

      <!-- Rutina del Día -->
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold tracking-wide">Rutina de Hoy</h3>
        <span class="text-xs bg-brand-600/20 text-brand-500 px-3 py-1 rounded-full border border-brand-500/30">Día de Pecho & Tríceps</span>
      </div>

      <!-- Lista de Ejercicios -->
      <div id="workout-container" class="space-y-4">
        <!-- Renderizado dinámico -->
      </div>
    </main>
  </div>

  <script>
    // BD de Ejercicios con interfaz para tracking
    const workoutPlan = [
      {
        id: 1,
        name: "Press de Banca Plano",
        target: "Pectoral Mayor",
        gif: "https://media.giphy.com/media/l3T5P1iR8A3U2fC1q/giphy.gif",
        sets: [
          { set: 1, targetReps: 10, weight: 60, done: false },
          { set: 2, targetReps: 10, weight: 65, done: false },
          { set: 3, targetReps: 8, weight: 70, done: false }
        ]
      },
      {
        id: 2,
        name: "Aperturas con Mancuernas",
        target: "Pectoral Superior",
        gif: "https://media.giphy.com/media/3o7TKSx0g7a90fL8k0/giphy.gif",
        sets: [
          { set: 1, targetReps: 12, weight: 16, done: false },
          { set: 2, targetReps: 12, weight: 18, done: false }
        ]
      }
    ];

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value;
      localStorage.setItem('fit_user', user);
      initApp();
    }

    function handleLogout() {
      localStorage.removeItem('fit_user');
      document.getElementById('auth-view').classList.remove('hidden');
      document.getElementById('app-view').classList.add('hidden');
    }

    function initApp() {
      const user = localStorage.getItem('fit_user');
      if (!user) return;

      document.getElementById('auth-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      document.getElementById('user-display').innerText = user;

      renderWorkout();
    }

    function toggleSet(exerciseId, setIdx) {
      workoutPlan[exerciseId].sets[setIdx].done = !workoutPlan[exerciseId].sets[setIdx].done;
      renderWorkout();
    }

    function renderWorkout() {
      const container = document.getElementById('workout-container');
      container.innerHTML = '';

      let totalVol = 0;
      let totalSets = 0;
      let completedSets = 0;

      workoutPlan.forEach((ex, exIdx) => {
        const card = document.createElement('div');
        card.className = "bg-dark-800 rounded-2xl border border-slate-700/60 overflow-hidden shadow-lg";

        let setsHTML = '';
        ex.sets.forEach((s, sIdx) => {
          totalSets++;
          if (s.done) {
            completedSets++;
            totalVol += (s.weight * s.targetReps);
          }

          setsHTML += `
            <div class="flex items-center justify-between p-2.5 rounded-xl ${s.done ? 'bg-emerald-500/10 border border-emerald-500/30' : 'bg-dark-900/50'}">
              <span class="text-xs font-bold text-slate-400">SERIE ${s.set}</span>
              <div class="flex items-center gap-3 text-sm">
                <span class="text-slate-300"><b>${s.weight}</b> kg</span>
                <span class="text-slate-400">x</span>
                <span class="text-slate-300"><b>${s.targetReps}</b> reps</span>
              </div>
              <button onclick="toggleSet(${exIdx}, ${sIdx})" class="w-8 h-8 rounded-lg flex items-center justify-center transition ${s.done ? 'bg-emerald-500 text-white' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}">
                <i class="fa-solid fa-check text-xs"></i>
              </button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="p-4 flex gap-4">
            <img src="${ex.gif}" class="w-24 h-24 object-cover rounded-xl bg-dark-900 border border-slate-700" alt="${ex.name}">
            <div class="flex-1">
              <h4 class="font-bold text-base text-white">${ex.name}</h4>
              <span class="text-xs text-brand-500 font-medium">${ex.target}</span>
              <div class="mt-3 space-y-2">
                ${setsHTML}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      // Stats
      document.getElementById('stat-exercises').innerText = workoutPlan.length;
      document.getElementById('stat-volume').innerText = totalVol + " kg";
      document.getElementById('stat-progress').innerText = Math.round((completedSets / totalSets) * 100) + "%";
    }

    // Auto logueo si hay sesión
    window.onload = initApp;
  </script>
</body>
</html>
